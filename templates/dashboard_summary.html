<div class="dashboard-summary">
    <div class="summary-card">
        <div class="card-title">Total Species</div>
        <div class="card-val">{{ TOTAL_SPECIES }}</div>
    </div>
    <div class="summary-card warning">
        <div class="card-title">Needs Tagging</div>
        <div class="card-val">{{ NEEDS_TAGGING }}</div>
    </div>
    <div class="summary-card primary">
        <div class="card-title">JSON Unpublished</div>
        <div class="card-val">{{ JSON_UNPUBLISHED }}</div>
    </div>
    <div class="summary-card error">
        <div class="card-title">Missing Location</div>
        <div class="card-val">{{ MISSING_LOCATION }}</div>
    </div>
    <div class="summary-card info">
        <div class="card-title">Missing eBird</div>
        <div class="card-val">{{ MISSING_EBIRD }}</div>
    </div>
</div>
